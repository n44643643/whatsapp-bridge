[supervisord]
nodaemon=true

[program:waha]
directory=/waha-app
command=node dist/main.js
environment=PORT="3000",WHATSAPP_DEFAULT_ENGINE="WEBJS",WHATSAPP_API_KEY="internal-waha-key-do-not-share"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:bridge]
directory=/bridge
command=node server.js
environment=PORT="8080",WAHA_URL="http://localhost:3000"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
